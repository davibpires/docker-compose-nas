services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: always
    network_mode: host
    privileged: true
    volumes:
      - ${CONFIG_ROOT:-.}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8123"]
      interval: 1m
      retries: 10
    labels:
      - homepage.group=Apps
      - homepage.name=Home Assistant
      - homepage.icon=home-assistant.png
      - homepage.href=http://${SERVER_IP}:8123
      - homepage.description=Smart home controller
      - homepage.weight=3
      - homepage.widget.type=homeassistant
      - homepage.widget.url=http://${SERVER_IP}:8123
      - homepage.widget.key=${HOMEASSISTANT_ACCESS_TOKEN}
    profiles:
      - homeassistant

  mosquitto:
    image: public.ecr.aws/docker/library/eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    ports:
      - "1883:1883"
    volumes:
      - ${CONFIG_ROOT:-.}/homeassistant/mosquitto/config:/mosquitto/config
      - ${CONFIG_ROOT:-.}/homeassistant/mosquitto/data:/mosquitto/data
      - ${CONFIG_ROOT:-.}/homeassistant/mosquitto/log:/mosquitto/log
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
    healthcheck:
      test:
        ["CMD", "mosquitto_sub", "-p", "1880", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 1m
      timeout: 10s
      retries: 3
    profiles:
      - mqtt

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8099:8080"
    volumes:
      - ${CONFIG_ROOT:-.}/homeassistant/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_22d71a94778aef11a49a22ccef8776e9-if00-port0:/dev/ttyUSB0
    group_add:
      - dialout
    environment:
      - TZ=${TIMEZONE}
    profiles:
      - zigbee

